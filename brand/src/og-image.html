<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-print-color-adjust:exact}
body{width:1200px;height:630px;background:#120C09;overflow:hidden;position:relative;
  font-family:'Manrope',system-ui,sans-serif}
.orb{position:absolute;border-radius:50%;filter:blur(90px)}
.orb.a{width:560px;height:560px;background:rgba(232,67,10,.16);top:-190px;right:-140px}
.orb.b{width:420px;height:420px;background:rgba(245,200,66,.10);bottom:-180px;left:-90px}
.wrap{position:relative;height:100%;padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between}
.bar{height:5px;width:88px;border-radius:3px;background:linear-gradient(135deg,#E8430A,#F5C842)}
h1{font-family:'DM Serif Display',Georgia,serif;font-size:74px;line-height:1.04;
  letter-spacing:-.03em;color:#F1E9E3;font-weight:400;margin-top:26px}
h1 em{font-style:italic;color:#E8430A}
p{font-size:24px;line-height:1.5;color:#BDB6B1;margin-top:22px;max-width:22em}
.foot{display:flex;align-items:flex-end;justify-content:space-between}
.mono{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:#635C59}
</style></head><body>
<div class="orb a"></div><div class="orb b"></div>
<div class="wrap">
  <img src="../logo/svg/echobrief-lockup-dark.svg" style="height:52px;width:auto;align-self:flex-start">
  <div>
    <div class="bar"></div>
    <h1>Every meeting,<br><em>briefed.</em></h1>
    <p>Summaries in 22 Indian languages. Auto-joins Meet, Zoom and Teams.</p>
  </div>
  <div class="foot">
    <span class="mono">echobrief.in</span>
    <span class="mono" style="color:#E8430A">Meet · Zoom · Teams</span>
  </div>
</div>
</body></html>
