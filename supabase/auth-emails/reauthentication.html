<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm it's you</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background-color:#FAF4EF;font-family:'Manrope',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background-color:#FAF4EF;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;background-color:#FEFBF8;border:1px solid #E0D5CF;border-radius:16px;overflow:hidden;">

          <tr><td style="height:4px;line-height:4px;font-size:0;background:linear-gradient(135deg, #D93F0B 0%, #F5C842 100%);background-color:#D93F0B;">&nbsp;</td></tr>

          <tr>
            <td style="padding:24px 28px 0;">
              <img src="https://www.echobrief.in/echobrief-lockup-light.png" width="150" height="57" alt="EchoBrief" style="display:block;border:0;outline:none;width:150px;height:auto;">
            </td>
          </tr>

          <tr>
            <td style="padding:22px 28px 0;">
              <div style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#AAA39F;">Security check</div>
              <h1 style="margin:8px 0 0;font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-size:30px;font-weight:400;line-height:1.2;color:#190F0B;">Confirm it's you</h1>
              
            </td>
          </tr>

          <tr>
            <td style="padding:20px 28px 22px;">
              
              <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr><td style="background-color:#F8E7DF;border:1px solid #F3CCBD;border-radius:12px;padding:16px 18px;">
                  <p style="margin:0 0 12px;font-family:'Manrope',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#190F0B;">Enter this code to confirm the action you started in EchoBrief.</p><div style="font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:30px;font-weight:600;letter-spacing:0.18em;color:#190F0B;padding-top:6px;">{{ .Token }}</div>
                </td></tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 22px;">
              <p style="margin:0;font-family:'Manrope',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.55;color:#827873;">If you did not start this, ignore this email and change your password.</p>
            </td>
          </tr>


          <tr>
            <td align="center" style="padding:0 40px 30px;">
              <p style="margin:0;font-family:'Manrope',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#AAA39F;">The code expires in 1 hour.</p>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:18px 28px;background-color:#FAF4EF;border-top:1px solid #EFE6E0;">
              <p style="margin:0;font-family:'Manrope',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;color:#827873;">Sent by <span style="font-family:'DM Serif Display',Georgia,'Times New Roman',serif;color:#190F0B;">echo<span style="font-style:italic;color:#B83508;">brief</span></span></p>
              <p style="margin:6px 0 0;font-family:'Manrope',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;">
                <a href="https://echobrief.in" style="color:#AAA39F;text-decoration:underline;">echobrief.in</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
